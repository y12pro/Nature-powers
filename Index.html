<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nature Powers</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07120a;color:#fff;font-family:Arial,sans-serif;text-align:center}
#wrap{max-width:440px;margin:auto;padding:8px}h1{margin:4px 0;font-size:26px}
#game{display:block;width:100%;height:auto;border:2px solid #8bc34a;border-radius:12px;background:#183b20;touch-action:none}
.controls{display:flex;justify-content:center;gap:7px;margin:8px 0}.controls button{font-size:19px;padding:11px 13px;border:0;border-radius:12px}
#message{min-height:24px;color:#c9e8c9}
#menu{position:fixed;inset:0;background:#07120a;display:flex;align-items:center;justify-content:center;z-index:3}
.card{width:min(90vw,390px);background:#12351c;border:2px solid #8bc34a;border-radius:20px;padding:28px}
.start{font-size:24px;padding:14px 28px;border:0;border-radius:14px}
</style>
</head>
<body>
<div id="menu"><div class="card"><h1>🌿 NATURE POWERS</h1><p>Gebruik natuurkrachten om fantasievijanden te verslaan!</p><br><button class="start" id="start">▶️ START</button></div></div>
<div id="wrap">
<h1>🌿 Nature Powers</h1>
<canvas id="game" width="420" height="620"></canvas>
<div class="controls"><button id="left">⬅️</button><button id="power">🌱 KRACHT</button><button id="right">➡️</button></div>
<div id="message">Tik op START om te beginnen.</div>
</div>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d"),menu=document.getElementById("menu"),msg=document.getElementById("message");

// Belangrijk: alle waarden krijgen meteen een beginwaarde.
let p={x:190,y:535,w:40,h:40};
let enemies=[],shots=[],keys={l:false,r:false};
let energy=100,score=0,level=1,hp=3,spawn=30,running=false;

function startGame(){
 p={x:190,y:535,w:40,h:40}; enemies=[]; shots=[]; keys={l:false,r:false};
 energy=100; score=0; level=1; hp=3; spawn=20; running=true;
 menu.style.display="none"; msg.textContent="🌱 Versla de monsters!";
}

function gameOver(text){
 running=false; msg.textContent=text+" Druk op START om opnieuw te spelen.";
 menu.style.display="flex";
}

function power(){
 if(!running || energy<10)return;
 energy-=10;
 shots.push({x:p.x+12,y:p.y-4,w:16,h:28});
}

function addEnemy(){
 const w=34;
 enemies.push({x:Math.random()*(420-w),y:-45,w:w,h:36,s:1.4+level*.2});
}

function hit(a,b){
 return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
}

function update(){
 if(!running)return;
 if(keys.l)p.x-=5;
 if(keys.r)p.x+=5;
 p.x=Math.max(0,Math.min(380,p.x));
 energy=Math.min(100,energy+0.15);

 if(--spawn<=0){
   addEnemy();
   spawn=Math.max(15,45-level*4);
 }

 for(let i=shots.length-1;i>=0;i--){
   shots[i].y-=10;
   if(shots[i].y<-50)shots.splice(i,1);
 }

 for(let i=enemies.length-1;i>=0;i--){
   const e=enemies[i];
   e.y+=e.s;
   let destroyed=false;
   for(let j=shots.length-1;j>=0;j--){
     if(hit(shots[j],e)){
       shots.splice(j,1); enemies.splice(i,1);
       score++; destroyed=true;
       if(score%6===0 && level<5){
         level++;
         msg.textContent="⭐ Level "+level+"!";
       }
       break;
     }
   }
   if(destroyed)continue;
   if(hit(e,p)){
     enemies.splice(i,1); hp--;
     if(hp<=0){gameOver("💫 Game over!");continue;}
   }else if(e.y>650){
     enemies.splice(i,1);
   }
 }
 if(level>=5 && score>=30)gameOver("🏆 Je bent de Nature Guardian!");
 msg.textContent=running?`❤️ ${hp}   ⭐ ${score}   🌿 Lv.${level}   ⚡ ${Math.floor(energy)}%`:msg.textContent;
}

function draw(){
 ctx.clearRect(0,0,420,620);

 ctx.fillStyle="#24572d";
 for(let i=0;i<15;i++)ctx.fillRect((i*57)%420,585-(i%4)*32,4,42);

 ctx.fillStyle="#fff";
 ctx.font="17px Arial";
 ctx.fillText(`❤️ ${hp}   ⭐ ${score}   🌿 Lv.${level}   ⚡ ${Math.floor(energy)}%`,10,25);

 // speler
 ctx.fillStyle="#67d24b";
 ctx.fillRect(p.x,p.y,p.w,p.h);
 ctx.fillStyle="#123";
 ctx.fillRect(p.x+8,p.y+9,7,7);
 ctx.fillRect(p.x+25,p.y+9,7,7);

 // natuurkracht
 ctx.fillStyle="#9df36b";
 shots.forEach(s=>ctx.fillRect(s.x,s.y,s.w,s.h));

 // vijanden
 enemies.forEach(e=>{
   ctx.fillStyle="#8056a8";
   ctx.fillRect(e.x,e.y,e.w,e.h);
   ctx.fillStyle="#111";
   ctx.fillRect(e.x+7,e.y+8,6,6);
   ctx.fillRect(e.x+e.w-13,e.y+8,6,6);
 });
}

function loop(){update();draw();requestAnimationFrame(loop)}

function hold(id,key){
 const b=document.getElementById(id);
 b.onpointerdown=e=>{e.preventDefault();keys[key]=true};
 ["pointerup","pointercancel","pointerleave"].forEach(v=>b.addEventListener(v,()=>keys[key]=false));
}

document.getElementById("start").onclick=startGame;
document.getElementById("power").onpointerdown=e=>{e.preventDefault();power()};
hold("left","l"); hold("right","r");

addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.l=true;
 if(e.key==="ArrowRight"||e.key==="d")keys.r=true;
 if(e.code==="Space")power();
});
addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.l=false;
 if(e.key==="ArrowRight"||e.key==="d")keys.r=false;
});

loop();
</script>
</body>
</html>
